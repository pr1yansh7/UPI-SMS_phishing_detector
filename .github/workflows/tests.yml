name: Tests

# This workflow is fully self-contained — if it breaks, only CI is affected.
# It does not touch any other file in the repo.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        run: |
          python -m pytest tests/ -v --tb=short

      - name: Verify all Python files compile
        run: |
          python -c "
          import py_compile, glob, sys
          files = (glob.glob('*.py') + glob.glob('features/*.py')
                   + glob.glob('tests/*.py'))
          failed = False
          for f in sorted(files):
              try:
                  py_compile.compile(f, doraise=True)
                  print(f'OK  {f}')
              except Exception as e:
                  print(f'ERR {f} -> {e}')
                  failed = True
          sys.exit(1 if failed else 0)
          "
